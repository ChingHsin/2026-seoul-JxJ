<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>
    <linearGradient id="ginkgoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="mapleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#E6DCCA" stroke-width="3"/>
  
  <!-- Outer decorative circle ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#E6DCCA" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Stylized Ginkgo Leaf (德壽宮石牆路銀杏意象) -->
  <g filter="url(#softShadow)" transform="translate(256,240)">
    <path d="M0,70 C-30,40 -90,20 -130,-40 C-150,-70 -140,-120 -110,-140 C-70,-165 -30,-145 0,-105 C30,-145 70,-165 110,-140 C140,-120 150,-70 130,-40 C90,20 30,40 0,70 Z" 
          fill="url(#ginkgoGold)"/>
    <!-- Leaf stem -->
    <path d="M0,65 Q-5,115 -15,145" fill="none" stroke="#92400E" stroke-width="7" stroke-linecap="round"/>
    <!-- Subtle leaf veins -->
    <path d="M0,-85 L-55,-125 M0,-75 L-95,-100 M0,-65 L-110,-55 M0,-85 L55,-125 M0,-75 L95,-100 M0,-65 L110,-55" 
          fill="none" stroke="#FDE68A" stroke-width="2.5" opacity="0.65" stroke-linecap="round"/>
  </g>
  
  <!-- Accent Maple Leaf small motif -->
  <path d="M370,320 L382,340 L405,335 L395,355 L412,370 L390,375 L385,395 L375,378 L355,385 L365,365 L350,350 L370,350 Z" 
        fill="url(#mapleRed)" opacity="0.85"/>
        
  <!-- Text Label -->
  <text x="256" y="445" font-family="'Noto Serif TC', serif, sans-serif" font-size="28" font-weight="700" fill="#292524" text-anchor="middle" letter-spacing="4">SEOUL 2026</text>
  <text x="256" y="475" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="500" fill="#78716C" text-anchor="middle" letter-spacing="2">10.29 – 11.03 AUTUMN</text>
</svg>
